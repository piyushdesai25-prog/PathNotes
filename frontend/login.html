<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · AI Banking Analytics</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="auth-screen">
  <div class="auth-visual">
    <div>
      <div class="brand-mark">AIBank</div>
      <div class="brand-sub">Analytics Ledger</div>
    </div>
    <div class="auth-quote">
      "Every transaction, scored. Every risk, seen before it lands."
    </div>
    <div class="auth-figures">
      <div><div class="n">2.4M+</div><div class="l">Transactions Scored</div></div>
      <div><div class="n">99.2%</div><div class="l">Fraud Model Uptime</div></div>
      <div><div class="n">18</div><div class="l">Branches Live</div></div>
    </div>
  </div>

  <div class="auth-panel">
    <div class="auth-form-card">
      <h1>Sign in</h1>
      <div class="sub">Access the banking analytics console.</div>

      <div class="auth-error" id="auth-error">Incorrect username or password.</div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div class="auth-row-between">
          <label class="checkbox-row"><input type="checkbox" id="remember" checked> Remember me</label>
          <a href="#" id="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-full" style="justify-content:center;">Sign in</button>
      </form>

      <div class="auth-demo-hint">
        DEMO — admin / admin123<br>or manager / manager123
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
